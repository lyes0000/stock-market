services:
  redis:
    image: redis:7-alpine
    restart: always

  app1:
    build: .
    environment:
      - SERVER_PORT=8081
      - SPRING_DATA_REDIS_HOST=redis
    depends_on:
      - redis
    restart: always

  app2:
    build: .
    environment:
      - SERVER_PORT=8082
      - SPRING_DATA_REDIS_HOST=redis
    depends_on:
      - redis
    restart: always

  nginx:
    image: nginx:alpine
    ports:
      - "${PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
    restart: always